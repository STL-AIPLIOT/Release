# Team STIL - SAC MLP smoke (Gate 2R)
#
# 목적: 파이프라인이 도는지만 확인한다. 1 iteration 후 bundle 이 써지면 통과.
# 본학습은 stil_sac_mlp_v1.yaml 로 따로 돌린다. 이 파일의 iterations 를 올리지 마라.
#
# 실행:
#   python -m ray stop --force
#   python scripts\run_experiment.py experiments\stil_sac_mlp_smoke.yaml --dry-run
#   python scripts\run_experiment.py experiments\stil_sac_mlp_smoke.yaml

name: stil_sac_mlp_smoke
script: train_rllib

# tag 를 v1 과 분리해 두어야 본학습 bundle 을 smoke 가 덮어쓰지 않는다.
output:
  name: stil
  tag: smoke

# 관측은 템플릿 기본값 tactical16 유지.
# custom(student.my_observation, 8-D)으로 바꾸면 관측 일관성 체인 5곳을 전부 맞춰야 하므로
# smoke 단계에서는 건드리지 않는다.
env:
  observation_mode: tactical16
  # observation_module: student.my_observation
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  # reward_module: student.my_reward
  max_engage_time: 60.0
  episode_step_limit: 3600

# step_ratio 는 6. my_submission.ACTION_REPEAT / --action-repeat 와 반드시 같아야 한다.
env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  target_loiter:
    enabled: true
    bank: 30.0
    pitch: 0.0
  target_autopilot:
    heading_cmd: 180.0
    altitude_cmd: 7000.0
    speed_cmd: 250.0
  reward:
    mode: default
    step_penalty: -0.01
    damage_scale: 20.0
    pursuit_scale: 0.3
    low_altitude_penalty: 0.1
    win_reward: 100.0
    loss_reward: -100.0
    draw_reward: -30.0

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 10000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

# runtime.iterations 는 run_experiment 경로에서 CLI override 가 없다. 반드시 여기서 바꾼다.
runtime:
  iterations: 1
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  checkpoint_frequency: 0
  save_native_checkpoint: false

dashboard:
  enabled: true
  logdir: artifacts/dashboard

# 1 iteration 이라 interval 10 인 probe 는 뜨지 않는다. smoke 를 조용하게 두기 위함.
policy_probe:
  enabled: false
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 10
  steps: 600
  episodes: 1
  print: true

notes: "Gate 2R smoke. 1 iteration, tactical16, bundle 은 artifacts/models/stil/smoke/ 에 쓰인다."
